name: OpenLNK Clean-Room CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanroom-isolation:
    name: Clean-Room Isolation & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify clean-room boundaries & zero-alloc/zero-float invariants
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 tools/ci/check_cleanroom_isolation.py \
              --diff-range "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            python3 tools/ci/check_cleanroom_isolation.py
          fi

      - name: Validate shell scripts and JSON manifests
        run: |
          bash -n tools/runner/run_86box.sh
          bash -n tools/runner/capture_golden_traces.sh
          bash -n tools/ci/install_hooks.sh
          bash -n analysis/start_ghidra_mcp.sh
          bash -n .githooks/pre-commit
          python3 -m json.tool .vscode/mcp.json > /dev/null
          python3 -m json.tool esp32/library.json > /dev/null
          python3 -m json.tool release-please-config.json > /dev/null
          python3 -m json.tool .release-please-manifest.json > /dev/null
          python3 -m py_compile esp32/pio_build.py esp32/tools/make_arduino_bundle.py

  c99-native-build:
    name: C99 Native (${{ matrix.os }} / ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
          - os: ubuntu-latest
            compiler: clang
            cc: clang
          - os: macos-latest
            compiler: clang
            cc: clang
          - os: windows-latest
            compiler: msvc
            cc: cl
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake (Unix)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
        run: cmake -S cleanroom -B cleanroom/build -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (Windows MSVC)
        if: runner.os == 'Windows'
        run: cmake -S cleanroom -B cleanroom/build

      - name: Build libopenlnk & desktop tools
        run: cmake --build cleanroom/build --config Release

      - name: Run C99 unit, loopback & fault-injection tests
        run: ctest --test-dir cleanroom/build -C Release --output-on-failure

      - name: Run opensvr & openlnk self-tests
        shell: bash
        run: |
          if [ -x cleanroom/build/opensvr ]; then
            ./cleanroom/build/opensvr --self-test
            ./cleanroom/build/openlnk --self-test
          else
            ./cleanroom/build/Release/opensvr.exe --self-test
            ./cleanroom/build/Release/openlnk.exe --self-test
          fi

      - name: Run AddressSanitizer & UndefinedBehaviorSanitizer tests
        if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'clang'
        env:
          CC: clang
          ASAN_OPTIONS: detect_stack_use_after_return=1:strict_string_checks=1:check_initialization_order=1:strict_init_order=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          cmake -S cleanroom -B cleanroom/build-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all"
          cmake --build cleanroom/build-asan
          ctest --test-dir cleanroom/build-asan --output-on-failure
          ./cleanroom/build-asan/opensvr --self-test
          ./cleanroom/build-asan/openlnk --self-test

  dos-16bit-watcom:
    name: MS-DOS 16-Bit Real-Mode (Open Watcom v2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Open Watcom v2 snapshot
        id: cache-watcom
        uses: actions/cache@v4
        with:
          path: /opt/watcom
          key: open-watcom-v2-linux-x64-v1

      - name: Install Open Watcom v2
        if: steps.cache-watcom.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/watcom
          curl -fsSL "https://github.com/open-watcom/open-watcom-v2/releases/download/Current-build/ow-snapshot.tar.xz" \
            | sudo tar -xJf - -C /opt/watcom

      - name: Cross-compile 16-bit DOS OPENSVR.EXE, OPENLNK.EXE & OPENLNK.SYS
        env:
          WATCOM: /opt/watcom
          INCLUDE: /opt/watcom/h
        run: |
          export PATH="$WATCOM/binl64:$PATH"
          make -C cleanroom/dos -f Makefile.watcom
          python3 tools/ci/verify_dos_binaries.py --build-dir cleanroom/dos/build

      - name: Upload 16-bit DOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openlnk-dos-16bit-binaries
          path: |
            cleanroom/dos/build/OPENSVR.EXE
            cleanroom/dos/build/OPENLNK.EXE
            cleanroom/dos/build/OPENLNK.SYS
            cleanroom/dos/build/OPENSVR.MAP
            cleanroom/dos/build/OPENLNKX.MAP
            cleanroom/dos/build/OPENLNK.MAP

  kaitai-and-vectors:
    name: Kaitai Struct & Differential Test Vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Kaitai Struct Compiler & runtime
        run: |
          KSC_VERSION="0.11"
          curl -fsSLO "https://github.com/kaitai-io/kaitai_struct_compiler/releases/download/${KSC_VERSION}/kaitai-struct-compiler_${KSC_VERSION}_all.deb"
          sudo apt-get update
          sudo apt-get install -y "./kaitai-struct-compiler_${KSC_VERSION}_all.deb"
          python3 -m pip install --upgrade kaitaistruct

      - name: Compile specs/interlnk_wire.ksy (Python & C++11)
        run: |
          kaitai-struct-compiler --target python --outdir tests/harness/parsers/ specs/interlnk_wire.ksy
          kaitai-struct-compiler --target cpp_stl --outdir tests/harness/parsers/ specs/interlnk_wire.ksy
          test -f tests/harness/parsers/interlnk_wire.py
          test -f tests/harness/parsers/interlnk_wire.cpp
          test -f tests/harness/parsers/interlnk_wire.h

      - name: Build C99 vector validator
        run: |
          cmake -S cleanroom -B cleanroom/build -DCMAKE_BUILD_TYPE=Release
          cmake --build cleanroom/build --target openlnk-vector-check

      - name: Validate JSON test vectors (Kaitai + C99 parity)
        run: |
          python3 tests/harness/test_runner.py \
            --require-kaitai \
            --c-binary cleanroom/build/openlnk-vector-check

  python-tooling-tests:
    name: Python Harness, Sniffer & Verifier Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Python tooling unit test suite
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

  esp32-idf-build:
    name: ESP32 Embedded (ESP-IDF 5.3.2 / ${{ matrix.target }})
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.3.2
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: esp32
            build_img_mode: true
          - target: esp32c3
            build_img_mode: false
    env:
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: 256M
    steps:
      - uses: actions/checkout@v4

      - name: Configure container ccache paths
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.ccache"
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Cache ESP-IDF ccache (${{ matrix.target }})
        uses: actions/cache@v4
        with:
          path: .ccache
          key: esp-idf-5.3.2-${{ matrix.target }}-${{ hashFiles('esp32/CMakeLists.txt', 'esp32/examples/sd_server_idf/CMakeLists.txt', 'esp32/examples/sd_server_idf/main/CMakeLists.txt', 'esp32/examples/sd_server_idf/main/Kconfig.projbuild', 'esp32/examples/dos_client_idf/CMakeLists.txt', 'esp32/examples/dos_client_idf/main/CMakeLists.txt', 'esp32/examples/dos_client_idf/main/Kconfig.projbuild') }}
          restore-keys: |
            esp-idf-5.3.2-${{ matrix.target }}-

      - name: Cross-compile sd_server_idf for ${{ matrix.target }} (Raw SD)
        run: |
          source /opt/esp/idf/export.sh
          cd esp32/examples/sd_server_idf
          idf.py -B "build_${{ matrix.target }}" -DSDKCONFIG="sdkconfig.${{ matrix.target }}" set-target "${{ matrix.target }}"
          idf.py -B "build_${{ matrix.target }}" -DSDKCONFIG="sdkconfig.${{ matrix.target }}" build 2>&1 | tee "build_${{ matrix.target }}/build.log"
          ! grep -nE "(/cleanroom/|/esp32/).*warning:" "build_${{ matrix.target }}/build.log"
          idf.py -B "build_${{ matrix.target }}" -DSDKCONFIG="sdkconfig.${{ matrix.target }}" size

      - name: Cross-compile sd_server_idf for ${{ matrix.target }} (VFS .img/.vhd mode)
        if: ${{ matrix.build_img_mode }}
        run: |
          source /opt/esp/idf/export.sh
          cd esp32/examples/sd_server_idf
          printf 'CONFIG_OPENLNK_STORAGE_MODE_IMG=y\n' > sdkconfig.ci_img
          idf.py -B "build_${{ matrix.target }}_img" -DSDKCONFIG="sdkconfig.${{ matrix.target }}_img" -DSDKCONFIG_DEFAULTS=sdkconfig.ci_img set-target "${{ matrix.target }}"
          idf.py -B "build_${{ matrix.target }}_img" -DSDKCONFIG="sdkconfig.${{ matrix.target }}_img" -DSDKCONFIG_DEFAULTS=sdkconfig.ci_img build 2>&1 | tee "build_${{ matrix.target }}_img/build.log"
          ! grep -nE "(/cleanroom/|/esp32/).*warning:" "build_${{ matrix.target }}_img/build.log"
          rm -f sdkconfig.ci_img

      - name: Cross-compile dos_client_idf for ${{ matrix.target }} (Client + /dos FatFs VFS)
        run: |
          source /opt/esp/idf/export.sh
          cd esp32/examples/dos_client_idf
          idf.py -B "build_${{ matrix.target }}" -DSDKCONFIG="sdkconfig.${{ matrix.target }}" set-target "${{ matrix.target }}"
          idf.py -B "build_${{ matrix.target }}" -DSDKCONFIG="sdkconfig.${{ matrix.target }}" build 2>&1 | tee "build_${{ matrix.target }}/build.log"
          ! grep -nE "(/cleanroom/|/esp32/).*warning:" "build_${{ matrix.target }}/build.log"
          idf.py -B "build_${{ matrix.target }}" -DSDKCONFIG="sdkconfig.${{ matrix.target }}" size

      - name: Show ccache statistics
        run: ccache -s

      - name: Upload ESP32 firmware binaries (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: openlnk-esp32-idf-${{ matrix.target }}
          path: |
            esp32/examples/sd_server_idf/build_${{ matrix.target }}/openlnk_sd_server.bin
            esp32/examples/sd_server_idf/build_${{ matrix.target }}/openlnk_sd_server.elf
            esp32/examples/dos_client_idf/build_${{ matrix.target }}/openlnk_dos_client.bin
            esp32/examples/dos_client_idf/build_${{ matrix.target }}/openlnk_dos_client.elf
