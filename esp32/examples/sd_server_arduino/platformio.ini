; PlatformIO example project for OpenLNK ESP32 SD Block Server (Arduino framework)
;
; Build for classic ESP32:   pio run -e esp32dev
; Build for ESP32-C3:        pio run -e esp32c3

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    file://../..

[env:esp32dev]
board = esp32dev
build_flags =
    -DOPENLNK_UART_PORT=1
    -DOPENLNK_UART_TX_PIN=17
    -DOPENLNK_UART_RX_PIN=16
    -DOPENLNK_SD_MOSI_PIN=23
    -DOPENLNK_SD_MISO_PIN=19
    -DOPENLNK_SD_CLK_PIN=18
    -DOPENLNK_SD_CS_PIN=5

[env:esp32c3]
board = esp32-c3-devkitm-1
build_flags =
    -DOPENLNK_UART_PORT=1
    -DOPENLNK_UART_TX_PIN=4
    -DOPENLNK_UART_RX_PIN=5
    -DOPENLNK_SD_MOSI_PIN=7
    -DOPENLNK_SD_MISO_PIN=2
    -DOPENLNK_SD_CLK_PIN=6
    -DOPENLNK_SD_CS_PIN=10
